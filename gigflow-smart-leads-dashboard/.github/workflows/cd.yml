name: CD — Deploy to Production

# ── Triggers ──────────────────────────────────────────────────────
# Only runs after CI passes on main. Never on PRs.
on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]

# One deployment at a time — never interleave
concurrency:
  group: cd-production
  cancel-in-progress: false

# ─────────────────────────────────────────────────────────────────
jobs:

  # ── Gate: only deploy if CI succeeded ────────────────────────
  check-ci:
    name: Verify CI passed
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'
    steps:
      - name: CI passed — proceeding to deploy
        run: echo "CI workflow succeeded. Triggering deployment."


  # ── Deploy Backend → Render ───────────────────────────────────
  deploy-backend:
    name: Deploy Backend to Render
    runs-on: ubuntu-latest
    needs: check-ci
    environment:
      name: production
      url: ${{ vars.RENDER_SERVICE_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Render deploy hooks are pre-authenticated URLs.
      # Store yours as: Settings → Secrets → RENDER_DEPLOY_HOOK_URL
      # Get it from: Render Dashboard → Your Service → Settings → Deploy Hooks
      - name: Trigger Render deploy
        run: |
          RESPONSE=$(curl --silent --show-error --fail-with-body \
            --max-time 30 \
            --request POST \
            "${{ secrets.RENDER_DEPLOY_HOOK_URL }}")
          echo "Render response: $RESPONSE"

      - name: Wait for Render deploy to complete
        run: |
          echo "Waiting 30s for Render to start the deploy..."
          sleep 30
          # Poll the health endpoint until it responds or we time out
          RETRIES=0
          MAX_RETRIES=20
          HEALTH_URL="${{ vars.RENDER_SERVICE_URL }}/health"
          until curl --silent --fail "$HEALTH_URL" > /dev/null 2>&1; do
            RETRIES=$((RETRIES + 1))
            if [ "$RETRIES" -ge "$MAX_RETRIES" ]; then
              echo "❌ Health check timed out after $((MAX_RETRIES * 15))s"
              exit 1
            fi
            echo "Waiting for health check... attempt $RETRIES/$MAX_RETRIES"
            sleep 15
          done
          echo "✅ Backend is live at $HEALTH_URL"

      - name: Notify deployment success
        run: |
          echo "🚀 Backend deployed successfully"
          echo "  Service URL : ${{ vars.RENDER_SERVICE_URL }}"
          echo "  Commit SHA  : ${{ github.sha }}"
          echo "  Triggered by: ${{ github.actor }}"


  # ── Deploy Frontend → Vercel ──────────────────────────────────
  deploy-frontend:
    name: Deploy Frontend to Vercel
    runs-on: ubuntu-latest
    needs: check-ci
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      # Pull Vercel project metadata (creates .vercel/project.json)
      # Requires: VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID in secrets
      - name: Pull Vercel environment
        working-directory: frontend
        run: |
          vercel pull --yes \
            --environment=production \
            --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID:     ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      # Build using Vercel's own build pipeline so env vars are injected
      # correctly from the Vercel dashboard settings.
      - name: Build with Vercel
        working-directory: frontend
        run: |
          vercel build --prod \
            --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID:     ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy prebuilt output to Vercel
        id: deploy
        working-directory: frontend
        run: |
          URL=$(vercel deploy --prebuilt --prod \
            --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$URL" >> $GITHUB_OUTPUT
          echo "✅ Frontend deployed to $URL"
        env:
          VERCEL_ORG_ID:     ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Notify deployment success
        run: |
          echo "🚀 Frontend deployed successfully"
          echo "  Deployment URL : ${{ steps.deploy.outputs.url }}"
          echo "  Commit SHA     : ${{ github.sha }}"
          echo "  Triggered by   : ${{ github.actor }}"


  # ── Summary ───────────────────────────────────────────────────
  deployment-summary:
    name: Deployment Summary
    runs-on: ubuntu-latest
    needs: [deploy-backend, deploy-frontend]
    if: always()

    steps:
      - name: Report outcome
        run: |
          BACKEND="${{ needs.deploy-backend.result }}"
          FRONTEND="${{ needs.deploy-frontend.result }}"

          echo "┌─────────────────────────────────────────┐"
          echo "│         GigFlow Deployment Report        │"
          echo "├─────────────────────────────────────────┤"
          echo "│  Backend  (Render) : $BACKEND"
          echo "│  Frontend (Vercel) : $FRONTEND"
          echo "│  Commit            : ${{ github.sha }}"
          echo "│  Branch            : ${{ github.ref_name }}"
          echo "└─────────────────────────────────────────┘"

          if [ "$BACKEND" != "success" ] || [ "$FRONTEND" != "success" ]; then
            echo "❌ One or more deployments failed."
            exit 1
          fi
          echo "✅ All deployments succeeded."
