# ─────────────────────────────────────────────────────────────────
# GigFlow – Production Nginx Configuration
# Serves the React SPA and reverse-proxies /api/* to the backend.
# ─────────────────────────────────────────────────────────────────

# Hide nginx version from response headers and error pages
server_tokens off;

# ── Gzip compression ─────────────────────────────────────────────
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_buffers 16 8k;
gzip_http_version 1.1;
gzip_min_length 256;
gzip_types
    application/atom+xml
    application/geo+json
    application/javascript
    application/x-javascript
    application/json
    application/ld+json
    application/manifest+json
    application/rdf+xml
    application/rss+xml
    application/vnd.ms-fontobject
    application/wasm
    application/x-web-app-manifest+json
    application/xhtml+xml
    application/xml
    font/eot
    font/otf
    font/ttf
    image/bmp
    image/svg+xml
    image/vnd.microsoft.icon
    image/x-icon
    text/cache-manifest
    text/calendar
    text/css
    text/javascript
    text/markdown
    text/plain
    text/xml
    text/vcard
    text/vnd.rim.location.xloc
    text/vtt
    text/x-component
    text/x-cross-domain-policy;

# ── Connection tuning ────────────────────────────────────────────
keepalive_timeout  65;
keepalive_requests 100;

# ── Upstream: Express backend ────────────────────────────────────
upstream backend {
    server backend:5000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;                # Accept any hostname
    root /usr/share/nginx/html;
    index index.html;

    # ── Security headers ─────────────────────────────────────────
    add_header X-Frame-Options           "SAMEORIGIN"            always;
    add_header X-Content-Type-Options    "nosniff"               always;
    add_header X-XSS-Protection          "1; mode=block"         always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy
        "default-src 'self'; \
         script-src 'self' 'unsafe-inline'; \
         style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; \
         font-src 'self' https://fonts.gstatic.com; \
         img-src 'self' data: blob:; \
         connect-src 'self'; \
         frame-ancestors 'none';"       always;

    # ── API reverse proxy ─────────────────────────────────────────
    # All /api/* requests are forwarded to the Express backend.
    # The frontend bundle uses VITE_API_BASE_URL=/api (relative),
    # so no CORS issues — same origin from the browser's perspective.
    location /api/ {
        proxy_pass         http://backend;
        proxy_http_version 1.1;

        # Forward real client info to Express
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Keep-alive to the upstream
        proxy_set_header Connection        "";

        # Timeouts
        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        # Buffer settings — avoids disk writes for small API responses
        proxy_buffering          on;
        proxy_buffer_size        4k;
        proxy_buffers            8 4k;
        proxy_busy_buffers_size  8k;

        # Pass error pages back to client, don't intercept
        proxy_intercept_errors off;
    }

    # ── Health check endpoint (for load balancers) ────────────────
    location = /health {
        access_log off;
        return 200 '{"status":"ok"}';
        add_header Content-Type application/json;
    }

    # ── Static asset caching ──────────────────────────────────────
    # Vite appends content hashes to JS/CSS filenames,
    # so 1-year immutable cache is safe.
    location ~* \.(?:js|css|woff2?|ttf|eot|otf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Cache images for 30 days
    location ~* \.(?:png|jpg|jpeg|gif|ico|svg|webp|avif)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    # ── index.html — never cache ──────────────────────────────────
    # Ensures users always get the latest deployment.
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header Pragma        "no-cache";
        expires 0;
    }

    # ── SPA fallback ──────────────────────────────────────────────
    # React Router handles all client-side routes.
    # Any path not matched above falls through to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Block hidden files ────────────────────────────────────────
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
